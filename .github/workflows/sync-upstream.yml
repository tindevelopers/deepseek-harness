# One-way upstream pull into the team fork's working branch.
#
# The team fork NEVER pushes to upstream. It only pulls upstream commits down.
# Because the fork keeps its own custom commits on `master`, upstream changes
# are MERGED into `master` (one-way) rather than fast-forwarding to match.
#
# On a schedule (and manually):
#   1. fetch upstream's default branch,
#   2. if upstream has NO new commits already in `master` (no net change), do
#      nothing — no branch, no PR, no push;
#   3. otherwise attempt the merge locally:
#      - clean merge  -> push `master` directly (auto-merge, no PR);
#      - merge conflict -> abort and open ONE PR (base master, head = upstream
#        HEAD) so a human resolves the conflicts and merges.
#
# There is deliberately no second hop (no master -> main propagate): `master`
# IS the working branch and upstream is merged straight into it.
#
# Lives in the team-fork-as-vendor lane: schedule + workflow_dispatch only,
# never pull_request.
name: Sync upstream (one-way merge)

on:
  schedule:
    # Every day at 02:00 UTC. Change the cron to adjust cadence.
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Override upstream repo (owner/name). Defaults to deepseek-ai/deepseek-harness.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  DEFAULT_UPSTREAM_REPO: 'deepseek-ai/deepseek-harness'

jobs:
  sync:
    name: Detect upstream and auto-merge (or open conflict PR)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve upstream repo and default branch
        id: upstream
        env:
          INPUT_REPO: ${{ inputs.upstream_repo }}
        run: |
          set -euo pipefail
          REPO="${INPUT_REPO:-${DEFAULT_UPSTREAM_REPO}}"
          BRANCH=$(gh api "repos/${REPO}" --jq '.default_branch' 2>/dev/null || echo master)
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "resolved upstream ${REPO} default branch: ${BRANCH}"

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: master
          persist-credentials: false

      - name: Detect drift behind upstream
        id: drift
        env:
          UPSTREAM_URL: https://github.com/${{ steps.upstream.outputs.repo }}.git
          BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          set -euo pipefail
          git remote add upstream "$UPSTREAM_URL"
          git fetch --no-tags --prune upstream "$BRANCH"
          BEHIND=$(git rev-list --count "upstream/$BRANCH" ^HEAD)
          HEAD_SHA=$(git rev-parse "upstream/$BRANCH")
          echo "behind=$BEHIND head=$HEAD_SHA branch=$BRANCH"
          echo "behind_count=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "upstream_head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "has_update=$([ "$BEHIND" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Nothing to pull (up to date with upstream)
        if: steps.drift.outputs.has_update == 'false'
        run: echo "no new net changes from upstream; nothing to pull"

      - name: Merge upstream into master (auto-merge, or open conflict PR)
        if: steps.drift.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          UPSTREAM: ${{ steps.upstream.outputs.repo }}
          BRANCH: ${{ steps.upstream.outputs.branch }}
          UPSTREAM_HEAD: ${{ steps.drift.outputs.upstream_head }}
          BEHIND: ${{ steps.drift.outputs.behind_count }}
        run: |
          set -euo pipefail
          git config user.name "dsh-sync-bot"
          git config user.email "dsh-sync-bot@users.noreply.github.com"
          gh auth setup-git >/dev/null

          if git merge --no-edit "upstream/$BRANCH"; then
            echo "==> clean merge of upstream/${BRANCH} into master; pushing"
            git push origin master
            echo "auto-merged upstream ${UPSTREAM} into master (HEAD $(git rev-parse --short HEAD))"
          else
            echo "==> upstream/${BRANCH} conflicts with master; opening a PR for human resolution"
            git merge --abort
            SHORT="${UPSTREAM_HEAD:0:12}"
            MERGE_BRANCH="sync/upstream-${SHORT}"
            git checkout -B "$MERGE_BRANCH" "$UPSTREAM_HEAD"
            git push origin "$MERGE_BRANCH"

            EXISTING=$(gh pr list --repo "$REPO_FULL" --base master --head "$MERGE_BRANCH" --state all --json number,state \
              --jq '.[] | select(.state=="OPEN") | .number' || true)
            if [ -n "$EXISTING" ]; then
              echo "conflict PR #$EXISTING already open for $MERGE_BRANCH; skipping creation."
              exit 0
            fi

            PR_BODY=$(cat <<EOF
            ## Sync upstream (one-way merge) — conflict needs resolution

            Upstream \`${UPSTREAM}\` could not be auto-merged into \`master\` because it conflicts with the team's custom commits on \`master\`. Resolve the conflicts and merge.

            - upstream HEAD: \`${UPSTREAM_HEAD}\`
            - merge branch: \`${MERGE_BRANCH}\`
            - \`master\` is behind by \`${BEHIND}\` upstream commit(s)

            Created by the \`Sync upstream (one-way merge)\` workflow.
            EOF
            )
            gh pr create \
              --repo "$REPO_FULL" \
              --title "sync(upstream): resolve conflict merging ${BRANCH} into master (${SHORT})" \
              --body "$PR_BODY" \
              --base master \
              --head "$MERGE_BRANCH"
          fi
