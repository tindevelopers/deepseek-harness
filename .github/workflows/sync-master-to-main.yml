# Propagate upstream into the team working branch. Fires when an upstream sync
# PR (head matching `sync/upstream-*`) is merged into `master`, then opens a
# second PR from a fresh `propagate/master-to-main-<sha12>` branch into `main`.
#
# Companion to sync-upstream.yml:
#   1. sync-upstream.yml      opens a PR that fast-forwards master to upstream/HEAD
#   2. human merges it
#   3. THIS workflow detects  that merge and proposes master → main
#   4. human merges it
#   5. devs pull main:        their working branch now reflects upstream + team work
#
# Lives in the team-fork-as-vendor lane, schedule-less — fires only on the
# trigger event of the upstream sync PR closing.
name: Sync master to main

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to update on this fork. Defaults to main.'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  # One propagate run per upstream merge; subsequent runs queue.
  group: propagate-master-to-main
  cancel-in-progress: false

env:
  DEFAULT_TARGET_BRANCH: 'main'
  # Only fire on PRs whose head branch looks like one of ours. The bot's
  # upstream-sync PRs use this prefix; setting it explicitly here keeps the
  # workflow from reacting to unrelated PRs into master.
  TRIGGER_HEAD_PREFIX: 'sync/upstream-'

jobs:
  propagate:
    # Trigger branch: only react when the merged PR's head is one we created.
    if: >
      github.event_name == 'pull_request'
      ? github.event.pull_request.merged == true
        && startsWith(github.event.pull_request.head.ref, env.TRIGGER_HEAD_PREFIX)
      : true
    name: Open master → main propagate PR
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve target branch
        id: target
        env:
          INPUT_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_BRANCH" ]; then
            BRANCH="$INPUT_BRANCH"
          else
            BRANCH="$DEFAULT_TARGET_BRANCH"
          fi
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "Resolved target branch (main-trunk) to $BRANCH"

      - name: Compute divergence between master and target
        id: check
        env:
          TARGET: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          if ! git rev-parse "origin/$TARGET" >/dev/null 2>&1; then
            echo "Target branch origin/$TARGET does not exist on this fork; skipping."
            echo "should_open=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MASTER_HEAD=$(git rev-parse origin/master)
          TARGET_HEAD=$(git rev-parse "origin/$TARGET")
          BEHIND=$(git rev-list --count "origin/master" "^origin/$TARGET")
          AHEAD=$(git rev-list --count "origin/$TARGET" "^origin/master")
          echo "master=$MASTER_HEAD target=$TARGET target_head=$TARGET_HEAD behind=$BEHIND ahead=$AHEAD"
          echo "behind_count=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "ahead_count=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "master_head=$MASTER_HEAD" >> "$GITHUB_OUTPUT"
          echo "target_head=$TARGET_HEAD" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -gt 0 ]; then
            echo "should_open=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_open=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open propagate PR
        if: steps.check.outputs.should_open == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_FULL: ${{ github.repository }}
          TARGET: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          MASTER_HEAD="${{ steps.check.outputs.master_head }}"
          BEHIND="${{ steps.check.outputs.behind_count }}"
          AHEAD="${{ steps.check.outputs.ahead_count }}"
          SHORT="${MASTER_HEAD:0:12}"
          BRANCH="propagate/master-to-main-${SHORT}"
          git checkout -B "$BRANCH" "origin/master"
          gh auth setup-git >/dev/null
          git push origin "$BRANCH"
          EXISTING=$(gh pr list --repo "$REPO_FULL" --base "$TARGET" --head "$BRANCH" --state all --json number,state \
            --jq '.[] | select(.state=="OPEN") | .number' || true)
          if [ -n "$EXISTING" ]; then
            echo "propagate PR #$EXISTING already open for $BRANCH; skipping creation."
            exit 0
          fi
          PR_BODY=$(cat <<EOF
          ## Sync master → main

          Brings \`${TARGET}\` up to \`master\` after \`Sync upstream\` landed.

          - master HEAD (just synced from upstream): \`${MASTER_HEAD}\`
          - ${TARGET} HEAD before this PR: \`${{ steps.check.outputs.target_head }}\`
          - propagate branch: \`${BRANCH}\`
          - behind by \`${BEHIND}\` master-only commits
          - ahead by \`${AHEAD}\` team-only commits already on ${TARGET}

          This PR was opened automatically by the \`Sync master to main\` GitHub Action in response to a \`sync/upstream-${SHORT}\` PR landing on master. CI on this PR is the gate; humans click the merge button.

          The expected merge is a fast-forward into \`${TARGET}\` because the propagate branch is positioned at \`origin/master\`. If the team's \`${TARGET}\` has moved ahead locally (its own PRs landed first), you'll get a real merge conflict and a non-FF landing, which is fine — review the conflict, resolve, and merge.
          EOF
          )
          gh pr create \
            --repo "$REPO_FULL" \
            --title "sync(master→${TARGET}): bring ${TARGET} to ${SHORT}" \
            --body "$PR_BODY" \
            --base "$TARGET" \
            --head "$BRANCH"
